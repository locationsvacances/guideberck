<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide du logis — Berck-sur-Mer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f3ec;
    --ink:#1e2a2f;
    --ink-soft:#5a6b6f;
    --line:#dcd5c6;
    --accent:#1c6e8c;
    --accent-soft:#e8a33d;
    --card:#ffffff;
  }
  body.berck{
    --accent:#3f6274;
    --accent-soft:#9fb9a8;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Work Sans", sans-serif;
    transition:background .5s ease;
  }
  h1,h2,h3,.display{
    font-family:"Fraunces", serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    backdrop-filter:blur(6px);
  }
  .brand{
    font-family:"Fraunces", serif;
    font-size:1.05rem;
    font-weight:600;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .switcher{
    display:flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    gap:2px;
  }
  .switcher button{
    border:none;
    background:transparent;
    padding:8px 16px;
    border-radius:999px;
    font-family:"Work Sans", sans-serif;
    font-size:0.85rem;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .3s ease;
  }
  .switcher button.active{
    background:var(--accent);
    color:#fff;
  }
  select#lang-select{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    padding:9px 14px;
    border-radius:999px;
    font-family:"Work Sans", sans-serif;
    font-size:0.85rem;
    font-weight:500;
    cursor:pointer;
  }
  .cover{
    max-width:920px;
    margin:28px auto 0;
    padding:0 24px;
    position:relative;
  }
  .cover img{
    width:100%;
    height:clamp(180px, 32vw, 320px);
    object-fit:cover;
    border-radius:18px;
    display:block;
  }
  .cover-credit{
    position:absolute;
    right:34px;
    bottom:10px;
    font-size:0.68rem;
    color:#fff;
    background:rgba(30,42,47,0.45);
    padding:2px 8px;
    border-radius:999px;
    letter-spacing:0.02em;
  }
  .hero{
    padding:36px 24px 0;
    max-width:920px;
    margin:0 auto;
    text-align:left;
  }
  .eyebrow{
    font-size:0.75rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin-bottom:10px;
  }
  .hero h1{
    font-size:clamp(2.4rem, 6vw, 4.2rem);
    line-height:0.98;
    margin:0 0 14px;
    color:var(--ink);
  }
  .hero p{
    font-size:1.05rem;
    color:var(--ink-soft);
    max-width:56ch;
    line-height:1.5;
  }
  .hero p a{
    color:var(--accent);
    font-weight:500;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .wave{
    display:block;
    width:100%;
    height:70px;
    margin-top:36px;
  }
  .wave path{
    fill:none;
    stroke:var(--accent);
    stroke-width:1.6;
    opacity:0.55;
  }
  main{
    max-width:920px;
    margin:0 auto;
    padding:8px 24px 80px;
  }
  section.block{
    padding:44px 0;
    border-bottom:1px solid var(--line);
  }
  section.block:last-child{ border-bottom:none; }
  .block-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
  }
  .icon{
    width:26px; height:26px;
    flex:none;
    color:var(--accent);
  }
  .block-head h2{
    font-size:1.5rem;
    margin:0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
    gap:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
  }
  .card h3{
    font-size:0.95rem;
    margin:0 0 8px;
    font-family:"Work Sans", sans-serif;
    font-weight:600;
  }
  .card a{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid var(--accent);
  }
  .card a:hover{
    color:var(--accent);
  }
  .card p{
    font-size:0.92rem;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0;
  }
  .fill{
    color:var(--accent-soft);
    background:rgba(232,163,61,0.14);
    padding:1px 6px;
    border-radius:5px;
    font-weight:500;
  }
  .wifi-actions{
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .btn-primary, .btn-secondary{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-family:"Work Sans", sans-serif;
    font-size:0.82rem;
    font-weight:500;
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
    text-decoration:none;
    border:1px solid transparent;
    transition:opacity .2s ease;
  }
  .btn-primary{
    background:var(--card);
    color:var(--accent);
    border-color:var(--accent);
  }
  .btn-secondary{
    background:transparent;
    color:var(--accent);
    border-color:var(--accent);
  }
  .btn-primary:hover, .btn-secondary:hover{
    opacity:0.85;
  }
  body.berck .fill{
    background:rgba(63,98,116,0.12);
    color:var(--accent);
  }
  ul.rules{
    list-style:none;
    margin:0; padding:0;
    display:flex; flex-direction:column; gap:10px;
  }
  ul.rules li{
    display:flex; gap:10px;
    padding-bottom:10px;
    border-bottom:1px dashed var(--line);
  }
  ul.rules li:last-child{ border-bottom:none; padding-bottom:0;}
  ul.rules p{ margin:0; font-size:0.92rem; color:var(--ink-soft); line-height:1.5;}
  .rules .num{
    font-family:"Fraunces", serif;
    color:var(--accent);
    font-weight:600;
    flex:none;
    width:22px;
  }
  .contact-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:10px 0;
    border-bottom:1px dashed var(--line);
    font-size:0.92rem;
    gap:12px;
  }
  .contact-row:last-child{border-bottom:none;}
  .contact-row .who{ color:var(--ink); font-weight:500; }
  .contact-row .num{ color:var(--ink-soft); text-align:right;}
  footer{
    text-align:center;
    padding:30px 24px 50px;
    color:var(--ink-soft);
    font-size:0.8rem;
  }
  .note{
    max-width:920px;
    margin:0 auto;
    padding:14px 24px 0;
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  @media (max-width:560px){
    .topbar{flex-direction:column; align-items:flex-start;}
    .controls{width:100%; justify-content:space-between;}
    .switcher{flex:1;}
    .switcher button{flex:1; text-align:center;}
  }
</style>
</head>

let currentLang = 'fr';
const currentProp = 'berck';

const langSelect = document.getElementById('lang-select');

function render(){
  const d = T[currentLang];
  const p = d.properties[currentProp];

  document.getElementById('brand-text').textContent = d.brand;
  document.getElementById('eyebrow').textContent = p.eyebrow;
  document.getElementById('hero-title').innerHTML = p.title;
  document.getElementById('hero-text').innerHTML = p.text;
  document.getElementById('wave').querySelector('path').setAttribute('d', wavePaths[currentProp]);

  document.getElementById('arrival-head').textContent = d.arrivalHead;
  document.getElementById('hours-label').textContent = d.hoursLabel;

  document.getElementById('wifi-copy').textContent = d.wifiCopy;
  document.getElementById('before-label').textContent = d.beforeLabel;
  document.getElementById('before-text').textContent = d.beforeText;
  document.getElementById('equip-label').textContent = d.equipLabel;
  document.getElementById('equip-text').textContent = d.equipText;

  document.getElementById('rules-head').textContent = d.rulesHead;

  document.getElementById('addr-activity-d').innerHTML = d.addr.activity.d;

    contactsCard.appendChild(row);
  });

  document.getElementById('footer-text').textContent = d.footer;

  langSelect.value = currentLang;
}

langSelect.addEventListener('change', (e) => { currentLang = e.target.value; render(); });

render();
